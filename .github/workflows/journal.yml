# Builds the players' journal (player/) and pushes it to the public journal repo,
# which serves it with GitHub Pages. Only the built output leaves this repo.
#
# One-time setup:
#   1. Create the public repo named in player/config.json ("public_repo"), empty.
#      In its Settings -> Pages, set Source to "Deploy from a branch", branch main, folder / (root).
#   2. Create a fine-grained token (GitHub Settings -> Developer settings -> Fine-grained tokens)
#      with access to ONLY that repo and "Contents: Read and write".
#   3. In THIS repo: Settings -> Secrets and variables -> Actions -> New secret, name JOURNAL_TOKEN.
name: Players' journal

on:
  push:
    branches: [main]
    paths: ["player/**", "codex/index.html", "codex/img/**", ".github/workflows/journal.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (fails if a secret leaks)
        run: python3 player/build.py
      - name: Push to the public journal repo
        env:
          TOKEN: ${{ secrets.JOURNAL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::JOURNAL_TOKEN is not set yet, so the journal was built but not published. See the setup steps at the top of this workflow."
            exit 0
          fi
          REPO=$(python3 -c "import json;print(json.load(open('player/config.json'))['public_repo'])")
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" public || { mkdir public && git -C public init -b main && git -C public remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"; }
          find public -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r player/dist/. public/
          cd public
          git config user.name "peppajoke"
          git config user.email "16992043+peppajoke@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
          git commit -m "Update the journal"
          git push origin HEAD:main
