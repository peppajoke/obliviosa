# Publishes the site on every push to main:
#   /            the players' journal (built by player/build.py, leak guard included)
#   /dm-aaa0a039/  the DM codex (an unlisted address; do not share it)
name: Site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["codex/**", "player/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the players' journal (fails if a secret leaks)
        run: python3 player/build.py --out site
      - name: Add the DM codex at its unlisted address
        run: |
          mkdir -p site/dm-aaa0a039
          cp -r codex/index.html codex/things.js codex/img site/dm-aaa0a039/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
